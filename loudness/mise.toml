# Loudness package — mise tasks
# The C libebur128 source is vendored in libebur128/ and compiled
# inline via Cgo by each parity_tests slice as its own self-contained
# oracle (see loudness/internal/parity_tests/smoke); the root package
# itself compiles no C, delegating to the pure-Go internal/r128 port. No
# system install or external build is needed for normal use.
#
# Task names below are bare (e.g. `test`, `parity`). Under monorepo
# mode (`experimental_monorepo_root = true` in the root mise.toml +
# MISE_EXPERIMENTAL=1), mise auto-prefixes these with the path to this
# config so they appear as `//loudness:test` etc.
#
# Build tags
# ----------
#   loudness_strict — bit-exact parity-assertion mode for the
#                      loudness/internal/parity_tests slices. Unlike
#                      libraries/flac's `flac_strict`, this tag does NOT
#                      change the Go port's own arithmetic: the pure-Go
#                      r128 package is unconditionally FMA-free (explicit
#                      float64() conversion barriers at every MAC site), so
#                      only the C oracle's build flags vary. The tag
#                      instead selects which bound each parity_tests
#                      assertion checks against: bit-exact / tight-ULP
#                      under the tag (paired with the CGO_CFLAGS below,
#                      which force the oracle to scalar unfused code), or a
#                      widened tolerance without it, loose enough to
#                      absorb FMA-fused oracle drift from a plain `go test
#                      ./...` build (e.g. plain CI, per
#                      .github/workflows/tests.yml). See each package's
#                      strict_on.go / strict_off.go and cgo.go doc comment.
#
# Parity-test CGO flags — the in-test C oracle is built with
# `-ffp-contract=off -fno-vectorize -fno-slp-vectorize -fno-unroll-loops`
# so it produces scalar unfused float code matching FMA-free Go. Go's
# cgo flag-security allowlist rejects these in-source, so they are set
# via CGO_CFLAGS env here (with CGO_CFLAGS_ALLOW=".*"). Each task
# repeats the env block so it's inherited when invoked via `mise run`
# from inside loudness/. `test` and `parity` also add
# `-tags=loudness_strict` so the parity assertions run in bit-exact mode
# to match the unfused oracle they're built alongside.
[tasks."test"]
description = "Run all loudness package tests (cgo oracle build, strict build — bit-exact parity mode)"
env = { CGO_CFLAGS = "-O2 -ffp-contract=off -fno-vectorize -fno-slp-vectorize -fno-unroll-loops", CGO_CFLAGS_ALLOW = ".*" }
run = "go test -tags=loudness_strict -count=1 ./..."

[tasks."parity"]
description = "Run the loudness parity suite (Go port vs vendored C libebur128 via cgo). Requires -tags=loudness_strict."
env = { CGO_CFLAGS = "-O2 -ffp-contract=off -fno-vectorize -fno-slp-vectorize -fno-unroll-loops", CGO_CFLAGS_ALLOW = ".*" }
run = "go test -tags=loudness_strict -count=1 ./internal/parity_tests/..."

# Benchmarks — native Go loudness metering vs the vendored C libebur128
# (cgo). Both bench tasks compile the C oracle with the same scalar
# flags as the parity oracle (`-ffp-contract=off -fno-vectorize
# -fno-slp-vectorize -fno-unroll-loops`, no intrinsics) so the C column
# is an apples-to-apples scalar reference, NOT a production libebur128
# build. Go's cgo flag-security allowlist rejects these in-source, so
# they are set via CGO_CFLAGS here (with CGO_CFLAGS_ALLOW=".*").
[tasks."bench"]
description = "Run Go vs C comparison benchmarks (default Go build)"
env = { CGO_CFLAGS = "-O2 -ffp-contract=off -fno-vectorize -fno-slp-vectorize -fno-unroll-loops", CGO_CFLAGS_ALLOW = ".*" }
run = "go test -bench=. -benchtime=2s -benchmem -run=^$ ./internal/parity_tests/benchcmp/"

[tasks."vet"]
description = "Run go vet on the loudness package (CGO_ENABLED=0, matches the default no-cgo build)"
run = "CGO_ENABLED=0 go vet -stdmethods=false -asmdecl=false ./..."
